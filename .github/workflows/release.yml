name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update NPM
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Preflight Build
        run: npm run build

      - name: Version Packages
        run: |
          # 1. If no manual changesets exist, dynamically generate automated patch changesets with conventional commit logs
          if [ ! -f .changeset/*.md ] || [ "$(ls -A .changeset/*.md 2>/dev/null | grep -v 'README.md')" = "" ]; then
            echo "No manual changesets found. Running Pro-Max auto-detection and grouping commit messages..."
            node .github/workflows/generate-changesets.js
          fi

          # 2. Bump versions locally based on changesets
          npx changeset version

          # 3. Commit and push version bumps back to main (if any)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "release: version packages [skip ci]"
            git push
          fi
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Publish to NPM
        run: |
          # Use native NPM workspaces publishing with explicit registry and provenance
          # We use --if-present and we'll let npm handle the version check
          # To avoid errors on existing versions, we can wrap it in a check

          # If NPM_TOKEN is provided as a secret, configure npm to use it for authentication.
          # Otherwise, the CLI will naturally fall back to OIDC Trusted Publishing.
          if [ -n "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN found. Configuring npm registry authentication..."
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          else
            echo "NPM_TOKEN not found. Using OIDC Trusted Publisher (OIDC settings must be configured on npmjs.com for each package)."
          fi

          # Only attempt to publish if the version is NOT on npm yet
          for pkg_dir in packages/*; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/package.json" ]; then
              PKG_NAME=$(node -p "require('./$pkg_dir/package.json').name")
              PKG_VERSION=$(node -p "require('./$pkg_dir/package.json').version")
              
              if ! npm info "$PKG_NAME@$PKG_VERSION" >/dev/null 2>&1; then
                echo "Publishing $PKG_NAME@$PKG_VERSION..."
                # Prefix with ./ to prevent npm from parsing local directories as GitHub shortcuts (e.g. packages/core -> github:packages/core)
                npm publish "./$pkg_dir" --provenance --access public --registry https://registry.npmjs.org
              else
                echo "$PKG_NAME@$PKG_VERSION is already published. Skipping."
              fi
            fi
          done

          # Create and push git tags (only if they don't exist)
          npx changeset tag || echo "Tags already exist"
          git push --tags || echo "Tags already synced"

          # Convert the new tags into official GitHub Releases with proper changelog descriptions
          node .github/workflows/create-releases.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

